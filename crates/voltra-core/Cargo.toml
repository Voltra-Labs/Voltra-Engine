[package]
name = "voltra-core"
description = "Application loop, windowing and platform layer for the Voltra engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
voltra-assets.workspace = true
voltra-audio.workspace = true
voltra-ecs.workspace = true
voltra-jobs.workspace = true
voltra-nav.workspace = true
voltra-physics.workspace = true
voltra-render.workspace = true
voltra-scene.workspace = true
winit.workspace = true
gilrs.workspace = true
egui.workspace = true
egui-winit.workspace = true
log.workspace = true
# The logger games start through `logging::init`, terminal or file.
env_logger.workspace = true
# An input map is a RON file, read in a pull request like a scene.
ron.workspace = true
serde.workspace = true

# The examples are real games written against the loop and need a logger;
# `voltra-testkit` is here for `scratch_root`, which the audio tests use to
# build an asset root without a fixture on disk.
[dev-dependencies]
voltra-testkit.workspace = true
