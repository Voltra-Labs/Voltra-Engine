[package]
name = "voltra-core"
description = "Application loop, windowing and platform layer for the Voltra engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Stamps the compiler version into the crate, so a game library built by
# another compiler is refused by name (`src/game/stamp.rs`).
build = "build.rs"

[dependencies]
voltra-profile.workspace = true
voltra-assets.workspace = true
voltra-audio.workspace = true
voltra-ecs.workspace = true
voltra-jobs.workspace = true
voltra-nav.workspace = true
voltra-net.workspace = true
voltra-replication.workspace = true
voltra-physics.workspace = true
voltra-render.workspace = true
voltra-scene.workspace = true
winit.workspace = true
gilrs.workspace = true
egui.workspace = true
egui-winit.workspace = true
log.workspace = true
# PNG encoding for headless screenshots; the same crate `voltra-assets`
# decodes with.
image.workspace = true
# An input map is a RON file, read in a pull request like a scene.
ron.workspace = true
serde.workspace = true

# The examples are real games written against the loop and need a logger;
# `voltra-testkit` is here for `scratch_root`, which the audio tests use to
# build an asset root without a fixture on disk.
[dev-dependencies]
voltra-testkit.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
web-time.workspace = true
# The browser: the console the log goes to, the storage saves go to, the
# future the renderer is built in (`app/web.rs`), and the pack fetched and
# the status line shown before a game starts (`start/web.rs`).
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = [
    "console",
    "Window",
    "Storage",
    "Document",
    "Element",
    "Response",
] }

# egui-winit's defaults, natively: the system clipboard, links, and both
# Linux display servers. The web has none of them.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# The logger games start through `logging::init`, terminal or file.
env_logger.workspace = true
# The editor loads a game crate's library to run its code, and reloads it
# when the crate's sources change.
libloading.workspace = true
notify-debouncer-full.workspace = true
egui-winit = { workspace = true, features = ["clipboard", "links", "wayland", "x11"] }

