<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voltra</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    /* The page sizes the canvas; the engine follows (WindowConfig, web). */
    canvas { display: block; width: 100%; height: 100%; outline: none; }
    #voltra-status {
      position: fixed; inset: auto 0 0 0; padding: 12px 16px;
      font: 14px/1.4 system-ui, sans-serif; color: #cfd3dc;
      white-space: pre-wrap;
    }
    #voltra-status[data-state="hidden"] { display: none; }
  </style>
</head>
<body>
  <div id="voltra-status">Loading…</div>
  <script type="module">
    // wasm-bindgen's output beside this page; `init` runs the player's `main`.
    import init from "./voltra-player.js";
    init().catch((error) => {
      const status = document.getElementById("voltra-status");
      status.dataset.state = "shown";
      status.textContent = `The game could not start: ${error}`;
      console.error(error);
    });
  </script>
</body>
</html>
