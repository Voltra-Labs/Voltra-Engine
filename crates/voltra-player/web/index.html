<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Voltra</title>
  <!-- No icon file ships: without this a browser asks for /favicon.ico and
       logs the host's 404 as an error in every player's console. -->
  <link rel="icon" href="data:,">
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
    /* The page sizes the canvas; the engine follows (WindowConfig, web). */
    /* touch-action: a finger on the game is the game's, not a page scroll or zoom. */
    canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
    #voltra-status {
      position: fixed; inset: auto 0 0 0; padding: 12px 16px;
      font: 14px/1.4 system-ui, sans-serif; color: #cfd3dc;
      white-space: pre-wrap;
    }
    #voltra-status[data-state="hidden"] { display: none; }
  </style>
</head>
<body>
  <div id="voltra-status">Loading…</div>
  <script type="module">
    // wasm-bindgen's output beside this page, named `game` (`--out-name
    // game`) whichever binary it is; `init` runs its `main`.
    import init from "./game.js";
    init().catch((error) => {
      const status = document.getElementById("voltra-status");
      status.dataset.state = "shown";
      status.textContent = `The game could not start: ${error}`;
      console.error(error);
    });
  </script>
</body>
</html>
