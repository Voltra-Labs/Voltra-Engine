[package]
name = "voltra-player"
description = "Runs a Voltra scene with no editor in it."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Off for `cargo run`, on for `cargo xtask dist`: no console window, and the
# log in a file beside the executable instead.
[features]
windowed = []

[dependencies]
voltra-assets.workspace = true
voltra-core.workspace = true
ron.workspace = true
serde.workspace = true
voltra-ecs.workspace = true
voltra-scene.workspace = true
log.workspace = true

# The browser: fetching the pack, and what is said on the page.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
js-sys.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Element", "Response"] }
