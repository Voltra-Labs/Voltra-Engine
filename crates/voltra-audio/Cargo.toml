[package]
name = "voltra-audio"
description = "Mixing and playing the sounds a scene asks for."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The only crate in the workspace allowed to name either of these, the same way
# `voltra-render` owns `wgpu` and `voltra-core` owns `winit`.
cpal.workspace = true
symphonia.workspace = true
log.workspace = true

# The browser's WebAudio as the output device; without it cpal has only a
# silent host on wasm.
[target.'cfg(target_arch = "wasm32")'.dependencies]
cpal = { workspace = true, features = ["wasm-bindgen"] }

[dev-dependencies]
voltra-testkit.workspace = true
