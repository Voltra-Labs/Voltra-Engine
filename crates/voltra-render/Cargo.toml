[package]
name = "voltra-render"
description = "GPU abstraction layer for the Voltra engine, built on wgpu."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
wgpu.workspace = true
pollster.workspace = true
log.workspace = true
bytemuck.workspace = true
glam.workspace = true
image.workspace = true
epaint.workspace = true

[dev-dependencies]
voltra-testkit.workspace = true

# WebGL2 beside WebGPU in a web build: wgpu picks WebGPU where the browser has
# it and falls back to WebGL2 where it does not (`GpuContext::new_async`).
[target.'cfg(target_arch = "wasm32")'.dependencies]
wgpu = { workspace = true, features = ["webgl"] }
