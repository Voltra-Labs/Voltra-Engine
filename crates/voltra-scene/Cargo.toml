[package]
name = "voltra-scene"
description = "Scene components and the geometry they turn into."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
voltra-assets.workspace = true
voltra-audio.workspace = true
voltra-ecs.workspace = true
voltra-render.workspace = true
log.workspace = true
serde.workspace = true
ron.workspace = true
# A replicated component on the wire (stage 114): compact, no field names.
postcard.workspace = true
uuid.workspace = true

[dev-dependencies]
voltra-testkit.workspace = true
image.workspace = true

# The web has no OS randomness for ids: the browser's crypto supplies it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { workspace = true, features = ["js"] }

