[package]
name = "voltra-assets"
description = "Loading and caching the files a scene refers to."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
voltra-audio.workspace = true
voltra-render.workspace = true
voltra-jobs.workspace = true
log.workspace = true
fontdue.workspace = true
rustybuzz.workspace = true
unicode-script.workspace = true
unicode-bidi.workspace = true
unicode-linebreak.workspace = true
# Atlas files are authoring artefacts, read in a pull request, like scenes.
ron.workspace = true
serde.workspace = true

# Hot reload watches files; a browser has none (`watch/web.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify-debouncer-full.workspace = true

[dev-dependencies]
voltra-testkit.workspace = true
# Only the tests encode a PNG; the crate itself never does — `Texture::from_png`
# does the decoding, inside `voltra-render`.
image.workspace = true
pollster.workspace = true
