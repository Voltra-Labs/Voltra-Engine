[package]
name = "voltra-assets"
description = "Loading and caching the files a scene refers to."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
voltra-audio.workspace = true
voltra-render.workspace = true
voltra-jobs.workspace = true
log.workspace = true
fontdue.workspace = true
# Atlas files are authoring artefacts, read in a pull request, like scenes.
ron.workspace = true
serde.workspace = true
# The texture packer decodes the loose pictures and encodes the sheet
# (`packer.rs`). Drawing still decodes through `voltra-render`.
image.workspace = true

# Hot reload watches files; a browser has none (`watch/web.rs`).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
notify-debouncer-full.workspace = true

[dev-dependencies]
voltra-testkit.workspace = true
pollster.workspace = true
