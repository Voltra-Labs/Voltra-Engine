[package]
name = "xtask"
description = "The repository's build tasks: `cargo xtask dist` packages a game."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# For the build manifest, which the player reads too: one parser, not two.
voltra-player.workspace = true
# The asset pack's format, which the web player reads back.
voltra-assets.workspace = true

[dev-dependencies]
voltra-testkit.workspace = true
