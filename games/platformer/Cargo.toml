[package]
name = "voltra-platformer"
description = "The sample platformer: a game crate the editor plays and a binary that ships."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A `cdylib` for the editor to load and play, an `rlib` for the binary that
# ships. No dev-dependencies, on purpose: the tests then build the engine
# with exactly the features the library is built with, so the library a test
# loads matches the test that loads it (`tests/plugin.rs`).
[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "voltra-platformer"
path = "src/main.rs"

[dependencies]
voltra-assets.workspace = true
voltra-core.workspace = true
voltra-ecs.workspace = true
voltra-render.workspace = true
voltra-scene.workspace = true
log.workspace = true
serde.workspace = true
