name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just where clippy is invoked explicitly.
  RUSTFLAGS: -D warnings
  # CI builds once and throws the result away: no debug info to write and
  # cache, no incremental state to keep. Backtraces still name functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # MSVC's link.exe is the slow step of every test binary on Windows; LLVM's
  # linker, shipped with the toolchain, reads the same libraries faster.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  # Formatting is platform-independent and finishes in seconds, so it runs on
  # its own rather than blocking behind a full compile.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    # One name for both, though Windows skips clippy: required checks are
    # matched by name.
    name: clippy + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let both platforms report; a Windows-only break should not hide a
      # Linux-only one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `cpal` links ALSA on Linux and `gilrs` links udev (gamepad hotplug),
      # and both `-sys` crates find them through pkg-config at build time.
      # Hosted Ubuntu images ship neither the headers nor the `.pc` files.
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      # Lints once, on Linux: they read the same code on both platforms, and
      # a second full check on Windows doubled its time. Windows still builds
      # every target under `-D warnings`, so a compiler warning there fails.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # The headless render tests skip themselves when no GPU adapter is
        # present, which is the normal case on hosted runners. They still guard
        # local runs and any self-hosted machine that has one.
        run: cargo test --workspace
