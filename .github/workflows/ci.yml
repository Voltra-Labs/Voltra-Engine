name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just where clippy is invoked explicitly.
  RUSTFLAGS: -D warnings
  # CI builds once and throws the result away: no debug info to write and
  # cache, no incremental state to keep. Backtraces still name functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # MSVC's link.exe is the slow step of every test binary on Windows; LLVM's
  # linker, shipped with the toolchain, reads the same libraries faster.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  # Formatting is platform-independent and finishes in seconds, so it runs on
  # its own rather than blocking behind a full compile.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The player for the browser: it has to keep building for wasm32 while
  # the web export is assembled (docs/plan-web.md). Lints too — code behind
  # `cfg(target_arch = "wasm32")` is compiled nowhere else.
  wasm:
    name: clippy (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: cargo clippy -p voltra-player --target wasm32-unknown-unknown -- -D warnings

  # The web builds end to end, opened in Chromium on WebGPU and on WebGL2
  # (SwiftShader, no GPU): the player's sandbox found in a screenshot, and
  # the platformer walked into a coin by the keyboard and heard. See
  # crates/voltra-player/web/test/.
  web:
    name: web player (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      # `cargo xtask pack` runs natively, and xtask links the engine.
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      # The CLI must be the version of the `wasm-bindgen` crate in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and Chromium
        run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      # Chromium's WebGPU canvas presents through Vulkan (SwiftShader); the
      # loader and a CPU driver give it one on a runner with no GPU.
      - name: Vulkan loader
        run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: The player's first frame
        run: node crates/voltra-player/web/test/first-frame.mjs
      - name: A game played, with sound
        run: node crates/voltra-player/web/test/play.mjs

  check:
    # One name for both, though Windows skips clippy: required checks are
    # matched by name.
    name: clippy + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let both platforms report; a Windows-only break should not hide a
      # Linux-only one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `cpal` links ALSA on Linux and `gilrs` links udev (gamepad hotplug),
      # and both `-sys` crates find them through pkg-config at build time.
      # Hosted Ubuntu images ship neither the headers nor the `.pc` files.
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      # Lints once, on Linux: they read the same code on both platforms, and
      # a second full check on Windows doubled its time. Windows still builds
      # every target under `-D warnings`, so a compiler warning there fails.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        # The headless render tests skip themselves when no GPU adapter is
        # present, which is the normal case on hosted runners. They still guard
        # local runs and any self-hosted machine that has one.
        run: cargo test --workspace
