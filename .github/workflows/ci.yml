name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings everywhere, not just where clippy is invoked explicitly.
  RUSTFLAGS: -D warnings
  # CI builds once and throws the result away: no debug info to write and
  # cache, no incremental state to keep. Backtraces still name functions.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  # MSVC's link.exe is the slow step of every test binary on Windows; LLVM's
  # linker, shipped with the toolchain, reads the same libraries faster.
  CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER: rust-lld.exe

jobs:
  # Formatting is platform-independent and finishes in seconds, so it runs on
  # its own rather than blocking behind a full compile.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # The player for the browser: it has to keep building for wasm32 while
  # the engine runs in browsers (docs/WEB.md). Lints too — code behind
  # `cfg(target_arch = "wasm32")` is compiled nowhere else.
  wasm:
    name: clippy (wasm32)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm32
      - run: cargo clippy -p voltra-player --target wasm32-unknown-unknown -- -D warnings
      # The browser's WebSocket transport and the page that probes it.
      - run: cargo clippy -p voltra-net --target wasm32-unknown-unknown --all-targets -- -D warnings

  # The web builds end to end, opened in Chromium on WebGPU and on WebGL2
  # (SwiftShader, no GPU): the player's sandbox found in a screenshot, and
  # the platformer walked into a coin by the keyboard and heard, and the
  # sample materials compiled and drawn by each backend. See
  # crates/voltra-player/web/test/.
  web:
    name: web player (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          key: web
      # `cargo xtask pack` runs natively, and xtask links the engine.
      - name: ALSA and udev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config
      # The CLI must be the version of the `wasm-bindgen` crate in Cargo.lock.
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.126
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Playwright and Chromium
        run: npm install --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      # Chromium's WebGPU canvas presents through Vulkan (SwiftShader); the
      # loader and a CPU driver give it one on a runner with no GPU.
      - name: Vulkan loader
        run: sudo apt-get install -y libvulkan1 mesa-vulkan-drivers
      - name: The player's first frame
        run: node crates/voltra-player/web/test/first-frame.mjs
      - name: A game played, with sound
        run: node crates/voltra-player/web/test/play.mjs
      - name: Sprite materials on both backends
        run: node crates/voltra-player/web/test/materials.mjs
      - name: A 3D scene and WebGL2's depth precision on both backends
        run: node crates/voltra-player/web/test/shapes3d.mjs
      - name: The platformer walked by a finger on its on-screen stick
        run: node crates/voltra-player/web/test/touch.mjs
      - name: A rebound key kept in localStorage across a reload
        run: node crates/voltra-player/web/test/rebind.mjs
      - name: Fullscreen from a tick, after a click
        run: node crates/voltra-player/web/test/fullscreen.mjs
      # voltra-net's browser WebSocket reaching a native server (no GPU).
      - name: A page connected to a native server
        run: node crates/voltra-player/web/test/net.mjs
      # The arena's web build joining a native arena-server over WebSocket.
      - name: The arena in a browser, joined to its server
        run: node crates/voltra-player/web/test/arena.mjs
      # The guide's checked blocks (docs/guide): a game made, tested and
      # built for the web, as a reader following it would.
      - name: The guide, followed
        run: cargo xtask guide

  check:
    # One name for both, though Windows skips clippy: required checks are
    # matched by name.
    name: clippy + tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # Let both platforms report; a Windows-only break should not hide a
      # Linux-only one.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # `cpal` links ALSA on Linux and `gilrs` links udev (gamepad hotplug),
      # and both `-sys` crates find them through pkg-config at build time.
      # Hosted Ubuntu images ship neither the headers nor the `.pc` files.
      - name: ALSA and udev headers
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config

      # Lints once, on Linux: they read the same code on both platforms, and
      # a second full check on Windows doubled its time. Windows still builds
      # every target under `-D warnings`, so a compiler warning there fails.
      - name: Clippy
        if: runner.os == 'Linux'
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Every shipped scene, prefab and clip is in the current format, as
      # the engine's own writer puts it (docs/ARCHITECTURE.md, stage 132).
      - name: Shipped files migrated
        if: runner.os == 'Linux'
        run: cargo xtask migrate --check

      - name: Tests
        # The headless render tests skip themselves when no GPU adapter is
        # present, which is the normal case on hosted runners. They still guard
        # local runs and any self-hosted machine that has one.
        run: cargo test --workspace

      # The editor itself, launched under Xvfb on a software Vulkan driver
      # and driven through its bridge: grid snapping, the Console's filter,
      # a project setting saved and read back (crates/voltra-editor/tests/bridge.rs);
      # two in-editor clients played over 100 ms of latency, the profiler's
      # net counters read back (tests/netplay.rs); a particle curve changing
      # the live preview as one undo entry (tests/particle_preview.rs).
      # winit opens libxkbcommon-x11 at run time on X11, and the runner
      # image does not ship it: without it the editor panics at startup.
      - name: The editor through its bridge
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y xvfb libvulkan1 mesa-vulkan-drivers libxkbcommon-x11-0
          xvfb-run -a cargo test -p voltra-editor --test bridge -- --ignored
          xvfb-run -a cargo test -p voltra-editor --test netplay -- --ignored
          xvfb-run -a cargo test -p voltra-editor --test particle_preview -- --ignored

      # The authoring windows through the same bridge: the texture packer,
      # the Atlas Editor slicing, renaming and saving a sheet (diffed against
      # the file expected), and the tilemap tools
      # (crates/voltra-editor/tests/authoring.rs). The packages installed above.
      - name: The authoring windows through the bridge
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p voltra-editor --test authoring -- --ignored

      # Prefab mode and the searches through the same bridge: a prefab
      # opened from an instance, edited with its own undo, saved, and the
      # instances in the scene following it; the hierarchy and the assets
      # searched by name and by type (crates/voltra-editor/tests/prefab_mode.rs).
      - name: Prefab mode and search through the bridge
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p voltra-editor --test prefab_mode -- --ignored

      # Variants and nested prefabs through the bridge: a variant made and
      # edited as an override; the base edited, and a plain instance, one of
      # the variant and one nested in an unsaved row prefab all following
      # it (crates/voltra-editor/tests/prefab_variant.rs).
      - name: Prefab variants through the bridge
        if: runner.os == 'Linux'
        run: xvfb-run -a cargo test -p voltra-editor --test prefab_variant -- --ignored

      # A game made from the template builds natively, lints clean, and its
      # library loads and plays as the editor loads it (its tests/plugin.rs).
      # Linux only, like the lints: the template is the same on both.
      - name: A generated game
        if: runner.os == 'Linux'
        run: |
          cargo xtask new-game ci-game
          cargo test -p ci-game
          cargo clippy -p ci-game --all-targets -- -D warnings

  # The benchmark suite (crates/voltra-bench, docs/ARCHITECTURE.md stage
  # 107), run on the base and on this commit in the same job, on the same
  # runner, three rounds interleaved so a slow minute of the machine falls
  # on both. Each side's best run is compared; a benchmark slower than its
  # threshold (set from measured noise) fails the job. A base from before
  # the suite existed has nothing to compare with: the head still runs.
  bench:
    name: benchmarks (regression check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base's commit, for its own copy of the suite.
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      # The engine links ALSA and udev; the GPU benchmarks draw on a
      # software Vulkan driver (lavapipe), as the headless tests do.
      - name: ALSA, udev and a software Vulkan driver
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libudev-dev pkg-config libvulkan1 mesa-vulkan-drivers
      # A pull request against its merge base; a push against the commit
      # it moved the branch from.
      - name: The base
        id: base
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base=$(git merge-base "origin/${{ github.base_ref }}" HEAD)
          else
            base="${{ github.event.before }}"
            git cat-file -e "$base^{commit}" 2>/dev/null || base=$(git rev-parse HEAD~1)
          fi
          echo "base: $base"
          git worktree add --detach ../base "$base"
          if [ -d ../base/crates/voltra-bench ]; then suite=yes; else suite=no; fi
          echo "suite=$suite" >> "$GITHUB_OUTPUT"
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      # One target directory: the dependencies build once, and each side's
      # binary is copied out before the other's replaces it.
      - name: Both suites, in release
        run: |
          mkdir -p bench-out
          if [ "${{ steps.base.outputs.suite }}" = yes ]; then
            cargo build --release -p voltra-bench --manifest-path ../base/Cargo.toml --target-dir target
            cp target/release/voltra-bench bench-out/voltra-bench-base
          fi
          cargo build --release -p voltra-bench --target-dir target
          cp target/release/voltra-bench bench-out/voltra-bench-head
      - name: Base and head, interleaved
        run: |
          for round in 1 2 3; do
            if [ -x bench-out/voltra-bench-base ]; then
              bench-out/voltra-bench-base run --out "bench-out/base-$round.json"
            fi
            bench-out/voltra-bench-head run --out "bench-out/head-$round.json"
          done
      - name: Compare
        run: |
          # The head's own run-to-run spread, for reading the verdict.
          bench-out/voltra-bench-head noise bench-out/head-*.json
          if [ ! -x bench-out/voltra-bench-base ]; then
            echo "::notice::the base (${{ steps.base.outputs.sha }}) has no benchmark suite to compare with"
            exit 0
          fi
          status=0
          bench-out/voltra-bench-head compare \
            --base bench-out/base-1.json --base bench-out/base-2.json --base bench-out/base-3.json \
            --head bench-out/head-1.json --head bench-out/head-2.json --head bench-out/head-3.json \
            || status=$?
          # 2: the reports do not compare (the JSON format changed).
          if [ "$status" -eq 2 ]; then
            echo "::warning::the base's benchmark results do not compare with the head's"
            exit 0
          fi
          exit "$status"
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmarks
          path: bench-out/*.json
          if-no-files-found: ignore
