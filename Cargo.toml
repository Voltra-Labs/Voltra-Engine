[workspace]
resolver = "2"
members = ["crates/*", "games/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Voltra-Labs/Voltra-Engine"

# Single source of truth for third-party versions. Member crates opt in with
# `dep.workspace = true` so the whole workspace can never split a version.
[workspace.dependencies]
voltra-assets = { path = "crates/voltra-assets" }
voltra-bridge = { path = "crates/voltra-bridge" }
voltra-audio = { path = "crates/voltra-audio" }
voltra-core = { path = "crates/voltra-core" }
voltra-ecs = { path = "crates/voltra-ecs" }
voltra-jobs = { path = "crates/voltra-jobs" }
voltra-nav = { path = "crates/voltra-nav" }
voltra-net = { path = "crates/voltra-net" }
voltra-physics = { path = "crates/voltra-physics" }
voltra-profile = { path = "crates/voltra-profile" }
voltra-player = { path = "crates/voltra-player" }
voltra-render = { path = "crates/voltra-render" }
voltra-replication = { path = "crates/voltra-replication" }
voltra-scene = { path = "crates/voltra-scene" }
voltra-server = { path = "crates/voltra-server" }
voltra-testkit = { path = "crates/voltra-testkit" }

wgpu = "30.0.0"
# `serde` for `KeyCode` and `MouseButton` in an input map file.
winit = { version = "0.30.13", features = ["serde"] }
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.33.3", features = ["bytemuck", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# Scene files are authoring artefacts: read in a pull request, merged in git.
ron = "0.12.3"
# The MCP server (`voltra-mcp`): the official Rust SDK over stdio, its async
# runtime, and what tool arguments and answers are made of.
rmcp = { version = "3.11.0", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
schemars = "1.2.3"
serde_json = "1.0.154"
base64 = "0.23.1"
# v7 rather than v4: the timestamp in the high bits means sorting by id sorts by
# creation, so a scene file is deterministic *and* appends new entities at the end.
uuid = { version = "1.24.0", features = ["v7", "serde"] }
# `std::time::Instant` panics on wasm32-unknown-unknown; this is the same
# type natively and `performance.now()` on the web. Web builds only.
web-time = "1.1.0"
# The web player's way into the browser: calling JavaScript, awaiting its
# promises, and the DOM APIs it names (console, fetch, localStorage). Web
# builds only, and `wasm-bindgen` must match the CLI `cargo xtask` runs.
wasm-bindgen = "0.2.126"
wasm-bindgen-futures = "0.4.76"
js-sys = "0.3.103"
web-sys = "0.3.103"
# PNG only: the default feature set drags in jpeg, gif, tiff, webp and more.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# The output device and nothing else: the mixer is ours, the way Godot's and
# Unreal's are theirs. Only `voltra-audio` may name it.
cpal = "0.18.2"
# The decoder, trimmed the way `image` is: WAV (`pcm` is its codec) and OGG
# (`vorbis` is its codec). `default` would also drag in FLAC, MKV, ADPCM and
# three metadata parsers for formats no scene names.
symphonia = { version = "0.6.1", default-features = false, features = [
    "wav",
    "pcm",
    "ogg",
    "vorbis",
] }
# Immediate-mode UI for the editor. `egui-wgpu` is pinned to wgpu 29 and cannot
# be used against wgpu 30, so the backend is ours; `epaint` is the tessellated
# output it consumes, and is all the render layer needs to know about.
egui = "0.35.0"
# Without its defaults so the web build leaves out the native clipboard;
# `voltra-core` turns them back on for native targets.
egui-winit = { version = "0.35.0", default-features = false }
epaint = { version = "0.35.0", default-features = false, features = ["bytemuck"] }
pollster = "1.0.1"
log = "0.4.33"
notify-debouncer-full = "0.7"
env_logger = "0.11.11"
# Gamepads: platform input, so only `voltra-core` names it, beside winit.
gilrs = "0.11.2"
# Rasterizes and lays out glyphs for `Text`. A leaf crate: parses the font,
# hands back coverage bitmaps; the atlas and the draw are ours.
fontdue = "0.9.5"
# Shapes text runs before `fontdue` rasterizes them by glyph id: kerning,
# ligatures, combining marks, complex scripts. A HarfBuzz port in pure Rust;
# a leaf crate, the runs and the fallback chain are ours (`fonts/shape.rs`).
rustybuzz = "0.20.1"
# Keeps a font's `rustybuzz::Face` beside the bytes it borrows, so a face is
# made once per font rather than once per layout (`fonts/font.rs`).
self_cell = "1.3.0"
# Splits a run where its script changes, so each run shapes with one script.
unicode-script = "0.5.9"
# The Unicode bidirectional algorithm (UAX #9): embedding levels and the
# visual order of a line's runs.
unicode-bidi = "0.3.18"
# Line break opportunities (UAX #14), so CJK wraps between characters.
unicode-linebreak = "0.1.5"
# Opens a game's dynamic library so the editor can run its code. A leaf
# crate over dlopen/LoadLibrary; what is loaded, and when it is trusted, is
# ours (`voltra-core/src/game/library.rs`).
libloading = "0.8.9"
# The native WebSocket listener and client of `voltra-net`: the blocking,
# stream-based crate, over a `TcpStream` we make non-blocking — no async
# runtime in the engine. Only `voltra-net` may name it.
tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
# A game's network messages: serde values as compact bytes (varints, no
# field names). `alloc` only — no `heapless`, no COBS framing (a datagram
# is already framed).
postcard = { version = "1.2.0", default-features = false, features = ["alloc"] }

# Our crates stay debuggable; dependencies are compiled optimized because we
# never step into them and wgpu/naga are painfully slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
