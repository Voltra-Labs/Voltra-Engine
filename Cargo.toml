[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Voltra-Labs/Voltra-Engine"

# Single source of truth for third-party versions. Member crates opt in with
# `dep.workspace = true` so the whole workspace can never split a version.
[workspace.dependencies]
voltra-assets = { path = "crates/voltra-assets" }
voltra-core = { path = "crates/voltra-core" }
voltra-ecs = { path = "crates/voltra-ecs" }
voltra-render = { path = "crates/voltra-render" }
voltra-scene = { path = "crates/voltra-scene" }
voltra-testkit = { path = "crates/voltra-testkit" }

wgpu = "30.0.0"
winit = "0.30.13"
bytemuck = { version = "1.25.2", features = ["derive"] }
glam = { version = "0.33.3", features = ["bytemuck", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
# Scene files are authoring artefacts: read in a pull request, merged in git.
ron = "0.12.2"
# v7 rather than v4: the timestamp in the high bits means sorting by id sorts by
# creation, so a scene file is deterministic *and* appends new entities at the end.
uuid = { version = "1.24.0", features = ["v7", "serde"] }
# PNG only: the default feature set drags in jpeg, gif, tiff, webp and more.
image = { version = "0.25.10", default-features = false, features = ["png"] }
# Immediate-mode UI for the editor. `egui-wgpu` is pinned to wgpu 29 and cannot
# be used against wgpu 30, so the backend is ours; `epaint` is the tessellated
# output it consumes, and is all the render layer needs to know about.
egui = "0.35.0"
egui-winit = "0.35.0"
epaint = { version = "0.35.0", default-features = false, features = ["bytemuck"] }
pollster = "1.0.1"
log = "0.4.33"
env_logger = "0.11.11"

# Our crates stay debuggable; dependencies are compiled optimized because we
# never step into them and wgpu/naga are painfully slow at opt-level 0.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3
